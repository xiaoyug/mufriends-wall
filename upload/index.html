<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>muShenzhen 2026 · 上传照片</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="muShenzhen 2026">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #f5f5f5; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    max-width: 560px;
    margin: 0 auto;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  .poster { background: #000; padding: 18px 12px 8px; text-align: center; }
  .poster img { width: 100%; height: auto; display: block; }
  .hash {
    margin: 4px 0 0;
    color: #e0f050;
    font-family: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .lead { margin: 0; padding: 16px 18px 0; font-size: 15px; color: #eee; }
  main { padding: 16px 18px 0; }
  .file { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .big {
    display: block; width: 100%;
    margin-top: 14px;
    padding: 18px 12px;
    background: #e0f050; color: #111;
    border: 3px solid #e0f050;
    font: inherit; font-size: 18px; font-weight: 800; text-align: center;
    cursor: pointer;
  }
  #preview { display: none; width: 100%; height: auto; margin-top: 14px; background: #111; }
  #preview.show { display: block; }
  label.field { display: block; margin-top: 12px; font-size: 15px; font-weight: 700; }
  label.field span { display: block; font-size: 12px; font-weight: 400; color: #aaa; }
  textarea, input[type="text"], input[type="date"] {
    display: block; width: 100%;
    margin-top: 6px;
    padding: 11px 12px;
    font: inherit; font-size: 16px;
    color: #111; background: #fff;
    border: 2px solid #111; border-radius: 0;
  }
  #caption-wrap[hidden] { display: none; }
  #status { min-height: 1.4em; margin: 12px 0 0; font-size: 14px; color: #ddd; }
  footer {
    margin-top: 28px;
    padding: 16px 18px 0;
    border-top: 1px solid #222;
    text-align: center;
    color: #9a9a9a;
    font-size: 12px;
  }
</style>
</head>
<body>
<header class="poster">
  <img src="header.jpg" alt="mushenzhen 2026 · MADE — IN — SHENZHEN">
  <p class="hash">#madeinshenzhen</p>
</header>
<p class="lead">上传一张现场照片，它会出现在大屏幕上。<br>Upload one event photo. It appears on the big screen.</p>
<main>
  <img id="preview" alt="照片预览 / Photo preview">
  <label class="field" id="caption-wrap" for="caption" hidden>一句话（可选）<span>Caption (optional)</span>
    <textarea id="caption" maxlength="140" placeholder="想写在照片旁边的话 / A short note next to the photo"></textarea>
  </label>
  <label class="big" id="pick-label" for="photo">添加照片 / Add a photo</label>
  <input class="file" id="photo" type="file" accept="image/*">
  <p id="status" role="status" aria-live="polite"></p>
</main>
<footer>
  <span id="offline">muShenzhen 2026</span><br>
  muShenzhen 2026 · upload v1
</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
