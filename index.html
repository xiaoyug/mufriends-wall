<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuFriends · 照片墙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fbfaf5;
    color: #111;
    user-select: none;
  }
  .mono { font-family: "SF Mono", Menlo, "Courier New", monospace; }

  /* ---- 顶栏 ---- */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 26px 36px 0;
    pointer-events: none;
  }
  #title-block { display: flex; flex-direction: column; gap: 10px; }
  #event-name {
    font-size: 64px; font-weight: 900; letter-spacing: -1px;
    color: #111; line-height: 1;
  }
  #event-name .ch { display: inline-block; }
  #slogan-pill {
    display: none;
    align-self: flex-start;
    background: #111; color: #fff;
    font-size: 18px; letter-spacing: 1px;
    padding: 8px 18px; border-radius: 999px;
    transform: rotate(-1.2deg);
  }
  #logo { width: 150px; height: auto; display: none; }

  /* ---- 滚动区 ---- */
  #wall {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: space-evenly;
    padding-top: 150px; padding-bottom: 12px;
  }
  .row { overflow: visible; white-space: nowrap; will-change: transform; }

  /* 拍立得贴纸卡片：白边 + 黑描边 + 硬投影 + 微旋转 */
  .cell {
    display: inline-block; vertical-align: top;
    position: relative;
    background: #fff;
    border: 3px solid #111;
    padding: 8px 8px 10px;
    box-shadow: 7px 7px 0 rgba(17,17,17,.9);
    transform: rotate(var(--tilt, 0deg));
  }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; background: #eee; }
  .cell .del {
    position: absolute; top: -14px; right: -14px;
    width: 34px; height: 34px; border-radius: 50%;
    background: #e23e3e; color: #fff; border: 3px solid #111;
    font-size: 17px; font-weight: 700; line-height: 28px; text-align: center;
    cursor: pointer; display: none; z-index: 3;
    box-shadow: 3px 3px 0 rgba(17,17,17,.9);
  }
  body.managing .cell .del { display: block; }

  /* ---- 新照片弹窗：大拍立得 + 黄色胶带 ---- */
  #popup {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(251,250,245,.72);
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  #popup.show { opacity: 1; }
  #popup-card {
    position: relative;
    background: #fff; border: 4px solid #111;
    padding: 20px 20px 26px;
    max-width: 58vw; text-align: center;
    box-shadow: 14px 14px 0 rgba(17,17,17,.9);
    transform: scale(.8) rotate(-2deg);
    transition: transform .35s cubic-bezier(.2,1.5,.4,1);
  }
  #popup.show #popup-card { transform: scale(1) rotate(-2deg); }
  #popup-card::before {
    content: ""; position: absolute; top: -18px; left: 50%;
    width: 130px; height: 34px; margin-left: -65px;
    background: rgba(247,215,8,.85);
    border: 2px solid rgba(17,17,17,.25);
    transform: rotate(-1.5deg);
  }
  #popup-card img {
    max-width: 100%; max-height: 52vh;
    display: block; margin: 0 auto;
    border: 3px solid #111;
  }
  #popup-nick {
    display: inline-block; margin-top: 16px;
    background: #111; color: #fff;
    font-size: 22px; letter-spacing: 1px;
    padding: 6px 16px; border-radius: 999px;
    transform: rotate(-.8deg);
  }
  #popup-nick:empty { display: none; }
  #popup-msg {
    font-size: 22px; font-weight: 700; color: #111;
    margin-top: 10px; line-height: 1.5;
    max-width: 52vw; word-break: break-word; white-space: pre-wrap;
  }
  #popup-msg:empty { display: none; }

  /* ---- 右下角上传二维码 ---- */
  #qr-box {
    position: fixed; right: 26px; bottom: 26px; z-index: 20;
    background: #fff; border: 3px solid #111; border-radius: 4px;
    padding: 12px 12px 8px; text-align: center; display: none;
    box-shadow: 6px 6px 0 rgba(17,17,17,.9);
    transform: rotate(1.2deg);
  }
  #qr-box .tip { color: #111; font-size: 14px; font-weight: 700; margin-top: 8px; letter-spacing: 1px; }

  /* ---- 空场提示 ---- */
  #empty {
    position: fixed; inset: 0; z-index: 5;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; color: #111;
  }
  #empty .ring {
    width: 150px; height: 150px; border-radius: 50%;
    border: 4px dashed #111;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px;
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #empty .big { font-size: 34px; font-weight: 900; }
  #empty .small { font-size: 17px; letter-spacing: 1px; color: #555; }

  /* ---- 装饰：漂浮的星号 ---- */
  .spark {
    position: fixed; z-index: 4; pointer-events: none;
    font-weight: 900; opacity: .9;
  }

  /* ---- 管理提示条 ---- */
  #mgr-bar {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) rotate(-.6deg);
    z-index: 40; background: #111; color: #fff;
    padding: 10px 22px; border-radius: 999px; font-size: 15px;
    display: none;
  }
  body.managing #mgr-bar { display: block; }

  /* ---- 状态灯 ---- */
  #status {
    position: fixed; left: 16px; bottom: 16px; z-index: 20;
    width: 12px; height: 12px; border-radius: 50%;
    background: #999; border: 2px solid #111; opacity: .8;
  }
  #status.ok { background: #2fa96b; }
  #status.err { background: #e23e3e; }
</style>
</head>
<body>

<div id="header">
  <div id="title-block">
    <div id="event-name"></div>
    <div id="slogan-pill" class="mono"></div>
  </div>
  <img id="logo" alt="mu shenzhen">
</div>

<div id="wall"></div>

<div id="empty">
  <div class="ring">📷</div>
  <div class="big">等待第一张照片</div>
  <div class="small mono">scan &amp; upload —— 照片会实时滚进来</div>
</div>

<div id="popup">
  <div id="popup-card">
    <img id="popup-img" alt="">
    <div><span id="popup-nick" class="mono"></span></div>
    <div id="popup-msg"></div>
  </div>
</div>

<div id="qr-box">
  <div id="qr"></div>
  <div class="tip mono">扫码上传 ↑</div>
</div>

<div id="mgr-bar" class="mono">管理模式：点照片上的 ✕ 删除 · 再按一次 M 退出</div>
<div id="status"></div>

<script src="vendor/qrcode.min.js"></script>
<script src="logo-data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
